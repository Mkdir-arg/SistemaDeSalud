openapi: 3.0.3
info:
  title: Cauce · API
  version: 1.0.0
  description: |2

    API de Cauce: flujos de trabajo para instituciones de salud.

    **Autenticación.** Todo requiere un token JWT (`Authorization: Bearer <token>`)
    que se obtiene en `POST /api/auth/token/`. Las dos excepciones son ese mismo
    endpoint y la pantalla pública de llamados de sala (`/api/pantalla/<token>/`),
    que se sirve sin sesión porque corre en un televisor.

    **Alcance.** Los listados devuelven sólo lo de las instituciones donde quien
    consulta tiene una membresía activa; el filtro es del servidor, no de la
    pantalla.

    **Listados.** Vienen paginados (`?page`, `?page_size`) y aceptan `?formato=csv`
    cuando el recurso declara columnas exportables.
paths:
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPairRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/archivos/:
    post:
      operationId: archivos_create
      description: Devuelve el nombre y la URL del archivo guardado, para referenciarlo
        desde un campo de formulario.
      summary: Sube un archivo
      tags:
      - registros
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/mis-tareas/:
    get:
      operationId: mis_tareas_retrieve
      description: 'Lo que le toca hacer a quien consulta, agrupado por origen: casos
        asignados, casos de sus grupos sin tomar y esperas vencidas.'
      summary: Tareas pendientes del usuario
      tags:
      - casos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/puestos/{nodo_id}/:
    get:
      operationId: puestos_retrieve
      description: 'Estado de un nodo para quien lo opera: la cola, los indicadores
        del día y el box que ocupa quien consulta, si el paso tiene fila.'
      summary: Puesto de trabajo de un paso
      parameters:
      - in: path
        name: nodo_id
        schema:
          type: integer
        required: true
      tags:
      - casos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/pantalla/{token}/:
    get:
      operationId: pantalla_retrieve
      description: 'Últimos pacientes llamados y desde qué box. **Sin autenticación**:
        se accede por un token impredecible que se genera al configurar el nodo, porque
        corre en un televisor de la sala y no hay quien inicie sesión ahí. Devuelve
        nombre y turno, así que el token es lo único que la protege: no se publica
        ni se pone en un QR.'
      summary: Pantalla pública de llamados (TV de sala de espera)
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - casos
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/usuarios/:
    get:
      operationId: usuarios_list
      description: |-
        ViewSet estándar: CRUD + filtrado por query params + scope por institución
        + autorización por rol (lectura abierta a miembros, escritura por capacidad)
        + orden y búsqueda por query param.

        `?ordering=` y `?search=` quedan disponibles en todos los listados. Cada
        viewset acota qué campos admite con `ordering_fields` y `search_fields`; sin
        declararlos, `ordering` no acepta nada y `search` se ignora (comportamiento de
        DRF), así que no hay riesgo de exponer campos por accidente.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Qué campo usar para ordenar los resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un número de página dentro del conjunto de resultados paginado.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Número de resultados a devolver por página.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Un término de búsqueda.
        schema:
          type: string
      tags:
      - usuarios
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUsuarioList'
          description: ''

# Ensayo aislado del issue #130. Usar junto al compose base, con proyecto
# salud-padron-130 y --env-file explícito; no cargar overrides de desarrollo.
# Las claves se generan para este ensayo y quedan fuera del repositorio.
services:
  db:
    environment:
      POSTGRES_DB: padron130
      POSTGRES_USER: padron130
      POSTGRES_PASSWORD: ${PADRON130_DB_PASSWORD:?Definir clave exclusiva del ensayo}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padron130 -d padron130"]
  backend:
    environment:
      DATABASE_URL: postgres://padron130:${PADRON130_DB_PASSWORD:?Definir clave exclusiva del ensayo}@db:5432/padron130
      DATABASE_SSL: "false"
      # La configuración de tests exige este marcador y un nombre de BD propio;
      # crea test_salud_financiadores_test, nunca migra la base de la demo.
      SALUD_TEST_DOCKER_PROJECT: salud-padron-130
      SALUD_TEST_POSTGRES_URL: postgres://padron130:${PADRON130_DB_PASSWORD:?Definir clave exclusiva del ensayo}@db:5432/salud_financiadores_test
      DJANGO_SECRET_KEY: ${PADRON130_DJANGO_SECRET_KEY:?Definir clave exclusiva del ensayo}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Definir clave exclusiva de las cuentas ficticias}
      ENTORNO: demo
      DJANGO_DEBUG: "false"
      DJANGO_SSL_REDIRECT: "false"
      DJANGO_HSTS_SECONDS: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      SEED_DEMO: "0"
      SEED_GUARDIA: "0"
      SALUD_INTEGRACIONES_PERMITIDAS: ""
      RENAPER_MODO: simulado
      RENAPER_URL: ""
      RENAPER_USUARIO: ""
      RENAPER_CLAVE: ""
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      EMAIL_HOST: ""
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      PORTAL_URL_BASE: http://127.0.0.1:8230
      CORS_ALLOWED_ORIGINS: http://localhost:8230,http://127.0.0.1:8230
    ports:
      - "127.0.0.1:8130:8000"
  frontend:
    ports: !override
      - "127.0.0.1:8230:80"
  tiempos:
    profiles: [padron130-servicios-adicionales]
  repartos:
    profiles: [padron130-servicios-adicionales]
  costos:
    profiles: [padron130-servicios-adicionales]
  respaldos:
    profiles: [padron130-servicios-adicionales]

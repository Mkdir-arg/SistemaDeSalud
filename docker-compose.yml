services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salud}
      POSTGRES_USER: ${POSTGRES_USER:-salud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salud}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salud}:${POSTGRES_PASSWORD:-salud}@db:5432/${POSTGRES_DB:-salud}
      DATABASE_SSL: "false"
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-me}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Este archivo es el despliegue real: acá los comandos de carga ficticia
      # (`seed_*`, `seed_entorno_demo`) se niegan a correr. La aplicación, si
      # falta la variable, asume `desarrollo`; por eso se fija explícitamente.
      # El override de desarrollo y el compose de demo la cambian.
      ENTORNO: ${ENTORNO:-produccion}
      SEED_DEMO: ${SEED_DEMO:-1}
      SALUD_INTEGRACIONES_PERMITIDAS: ${SALUD_INTEGRACIONES_PERMITIDAS:-}
    volumes:
      - media:/app/media
      - respaldos:/respaldos
    # El chequeo consulta la base, no sólo que el proceso responda: una
    # instancia que contesta HTTP pero no llega a Postgres no puede atender a
    # nadie, y sin esto el orquestador la deja en rotación igual.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health/', timeout=4).status==200 else 1)\""]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  # Reloj del motor: reactiva las esperas por tiempo vencidas y avisa las
  # demoras. Sin esto un caso que entra a «Observación 6 horas» no vuelve nunca
  # y los SLA declarados en el diseñador no se cumplen solos.
  #
  # Es un bucle y no cron para no meter un demonio más en la imagen: el comando
  # es idempotente y toma cada caso con `select_for_update(skip_locked)`, así que
  # correrlo de más no hace daño.
  tiempos:
    build: ./backend
    command: >
      sh -c "while true; do
               python manage.py correr_tiempos || true;
               python manage.py recordar_turnos || true;
               python manage.py alertar_saturacion || true;
               sleep ${INTERVALO_TIEMPOS:-120};
             done"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salud}:${POSTGRES_PASSWORD:-salud}@db:5432/${POSTGRES_DB:-salud}
      DATABASE_SSL: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-me}
      # Misma imagen que backend: sin esto, `exec <servicio> manage.py seed_*`
      # corría con el valor por defecto (`desarrollo`) y podía vaciar la base.
      ENTORNO: ${ENTORNO:-produccion}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      # No siembra: de eso se ocupa `backend`.
      SEED_DEMO: "0"
    depends_on:
      db:
        condition: service_healthy

  # Repartos por eventos: la fuente y su solicitud se confirman juntas.
  # El proceso recibe NOTIFY después del commit; la cola sobrevive a reinicios.
  repartos:
    build: ./backend
    entrypoint: ["python"]
    command: ["manage.py", "escuchar_repartos"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salud}:${POSTGRES_PASSWORD:-salud}@db:5432/${POSTGRES_DB:-salud}
      DATABASE_SSL: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-me}
      # Misma imagen que backend: sin esto, `exec <servicio> manage.py seed_*`
      # corría con el valor por defecto (`desarrollo`) y podía vaciar la base.
      ENTORNO: ${ENTORNO:-produccion}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      SEED_DEMO: "0"
      SEED_GUARDIA: "0"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "manage.py", "shell", "-c", "from datetime import timedelta; from django.utils import timezone; from apps.auditoria.latidos import Latido; import sys; sys.exit(0 if Latido.objects.filter(servicio='repartos_eventos', momento__gte=timezone.now()-timedelta(minutes=2)).exists() else 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # Recuperación económica separada del reloj clínico: un lote de costos lento
  # no puede retrasar reactivaciones, recordatorios ni alertas del paciente.
  # La cadencia es operativa y configurable; no expresa un SLA de costeo.
  costos:
    build: ./backend
    command: >
      sh -c "while true; do
               python manage.py procesar_costos --limite ${COSTOS_LOTE:-100} || true;
               sleep ${INTERVALO_COSTOS:-120};
             done"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salud}:${POSTGRES_PASSWORD:-salud}@db:5432/${POSTGRES_DB:-salud}
      DATABASE_SSL: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-me}
      # Misma imagen que backend: sin esto, `exec <servicio> manage.py seed_*`
      # corría con el valor por defecto (`desarrollo`) y podía vaciar la base.
      ENTORNO: ${ENTORNO:-produccion}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      SEED_DEMO: "0"
      SEED_GUARDIA: "0"
      EJECUTAR_MIGRACIONES: "0"
    depends_on:
      db:
        condition: service_healthy

  # Respaldo diario, con la restauración verificada en cada corrida.
  #
  # Va como servicio y no como una línea más del reloj porque son cadencias
  # distintas: el reloj corre cada dos minutos y esto una vez por día.
  #
  # Verifica siempre. Un respaldo que nunca se restauró no es un respaldo, y la
  # falla clásica es que el cron corrió dos años, los archivos estaban ahí, y el
  # día que hizo falta ninguno servía.
  respaldos:
    build: ./backend
    command: >
      sh -c "while true; do
               python manage.py respaldar --conservar ${RESPALDOS_CONSERVAR:-14} || true;
               sleep ${INTERVALO_RESPALDO:-86400};
             done"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salud}:${POSTGRES_PASSWORD:-salud}@db:5432/${POSTGRES_DB:-salud}
      DATABASE_SSL: "false"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-me}
      # Misma imagen que backend: sin esto, `exec <servicio> manage.py seed_*`
      # corría con el valor por defecto (`desarrollo`) y podía vaciar la base.
      ENTORNO: ${ENTORNO:-produccion}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      SEED_DEMO: "0"
    volumes:
      - respaldos:/respaldos
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media:/usr/share/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
  respaldos:

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <title>I-Core Salud</title>
    <script>
      // Aplica el tema ANTES de pintar. Si esto se hiciera desde React, la página
      // se dibujaría un instante en claro y saltaría a oscuro: en un puesto con
      // turno noche ese fogonazo blanco es exactamente lo que se quiere evitar.
      (function () {
        try {
          // El login siempre se ve en claro, aunque la preferencia sea oscura:
          // es la cara institucional del sistema y tiene que verse igual en
          // cualquier puesto. La misma regla vive en src/lib/tema.js (esRutaClara),
          // acá repetida porque este script corre antes de que exista el bundle.
          if (location.pathname.replace(/\/+$/, "") === "/login") return;
          var t = localStorage.getItem("salud.tema");
          var oscuro = t === "oscuro" || (!t && matchMedia("(prefers-color-scheme: dark)").matches);
          if (oscuro) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

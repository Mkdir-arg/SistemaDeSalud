# Configuración de nginx para el frontend desplegado SOLO, con la API en otro
# dominio (un servicio por dominio: Railway y similares).
#
# Por qué un archivo aparte y no parámetros sobre `nginx.conf`:
#
# `nginx.conf` proxea /api, /admin y /static a `http://backend:8000`, que es el
# nombre del servicio en docker compose. nginx resuelve los destinos literales de
# `proxy_pass` al CARGAR la configuración, no por pedido: si ese host no existe
# —acá no existe, la API está en otro dominio— nginx falla con «host not found in
# upstream» y no arranca. No es que /api devuelva error: no se sirve NADA, ni la
# SPA.
#
# La otra mitad del cambio está en el build: la SPA se compila con VITE_API_URL
# apuntando al dominio de la API, así que no necesita el proxy. Acá sólo se
# sirven los estáticos.
#
# Se elige con el build arg NGINX_CONF del Dockerfile. Sin ese arg se usa
# `nginx.conf`, que es lo que corresponde en compose.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Comprime lo que se transfiere. En compose esto lo hacía irrelevante la red
    # local; sobre internet, el bundle de la SPA son cientos de kB.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets con hash en el nombre (Vite) son inmutables: si el contenido
    # cambia, cambia el nombre. Cachearlos un año ahorra el viaje completo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El index NO se cachea: es el que apunta a los assets nuevos después de cada
    # despliegue. Cacheado, el navegador seguiría pidiendo un bundle que ya no
    # existe.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida cae en index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API de Django.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 12m;  # acompaña DATA_UPLOAD_MAX_MEMORY_SIZE (10 MB)
    }

    # Panel de admin de Django y sus estáticos (vía WhiteNoise).
    location ~ ^/(admin|static)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /media/ no se sirve. Todo lo que el backend guarda en MEDIA_ROOT son
    # archivos clínicos (`uploads/<institución>/<uuid>.<ext>`) y salen sólo por
    # Django, que valida permisos y audita cada descarga
    # (/api/archivos/descargar/…, evidencias, portal del paciente). Servir el
    # volumen desde acá dejaba bajar cualquier archivo sin sesión con sólo
    # conocer la ruta. 404 explícito y no el fallback de la SPA, para que nadie
    # confunda un 200 con index.html con un archivo que existe.
    location /media/ {
        return 404;
    }
}
